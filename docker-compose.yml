version: '3.8'

services:
  # =========================================================================
  # 1. BASE DE DONNÉES & CACHE
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_admin}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres_admin} -d ${POSTGRES_DB:-enterprise_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    network_mode: bridge

  redis:
    image: redis:7-alpine
    container_name: local-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    network_mode: bridge

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: local-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    network_mode: bridge

  minio:
    image: bitnamilegacy/minio:latest
    container_name: local-minio
    restart: unless-stopped
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}"
    volumes:
      - minio_data:/bitnami/minio/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    network_mode: bridge

  # =========================================================================
  # 2. AUTHENTIFICATION & SSO (Keycloak)
  # =========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: local-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-enterprise_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres_admin}
      KC_DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - ./security/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    links:
      - postgres
    network_mode: bridge

  # =========================================================================
  # 3. MOTEUR D'INFÉRENCE LLM (vLLM avec fallback Ollama pour 8-12Go VRAM)
  # =========================================================================
  vllm:
    image: vllm/vllm-openai:latest
    container_name: local-vllm
    profiles: [gpu]
    restart: unless-stopped
    command: >-
      --model ${MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      --host 0.0.0.0
      --port 8000
      --served-model-name enterprise-model
      --gpu-memory-utilization 0.85
      --max-model-len 8192
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8001:8000"
    ipc: host
    network_mode: bridge
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Moteur alternatif léger (pour machines à faible VRAM)
  ollama:
    image: ollama/ollama:latest
    container_name: local-ollama
    profiles: [cpu]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    network_mode: bridge

  # =========================================================================
  # 4. BACKEND API & FRONTEND WEB
  # =========================================================================
  api:
    build: ./services/api
    container_name: local-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-enterprise_docs}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}"
      MINIO_BUCKET: ${MINIO_BUCKET:-enterprise-files}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      LLM_MODE: ${LLM_MODE:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://vllm:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-none}
      MODEL_NAME: ${MODEL_NAME:-enterprise-model}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:0.6b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
      MAX_CONTEXT_CHUNKS: ${MAX_CONTEXT_CHUNKS:-3}
      MAX_HISTORY_MESSAGES: ${MAX_HISTORY_MESSAGES:-6}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-45}
      INTENT_ROUTING_ENABLED: ${INTENT_ROUTING_ENABLED:-true}
      INTENT_TIMEOUT_SECONDS: ${INTENT_TIMEOUT_SECONDS:-8}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      DEV_USER_ID: ${DEV_USER_ID:-dev-user-01}
      DEV_USER_NAME: ${DEV_USER_NAME:-DevUser}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-dev@company.local}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/enterprise}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/enterprise/protocol/openid-connect/certs}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-enterprise-api}
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - hf_sentence_cache:/root/.cache/huggingface
      - ./models:/models
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    links:
      - postgres
      - qdrant
      - minio
      - keycloak
    network_mode: bridge

  web:
    build: ./apps/web
    container_name: local-web
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_AUTH_MODE: ${VITE_AUTH_MODE:-keycloak}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
      VITE_CODESPACES_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-enterprise}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-enterprise-web}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    links:
      - api
    network_mode: bridge

# =========================================================================
# VOLUMES & RÉSEAUX
# =========================================================================
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  hf_cache:
  hf_sentence_cache:
  ollama_data:
